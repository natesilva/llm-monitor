<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>LLM Monitor</title>
        <style>
            :root,
            [data-theme="dark"] {
                --bg: #0f1117;
                --fg: #e0e0e0;
                --fg-heading: #fff;
                --fg-subtle: #888;
                --fg-muted: #666;
                --fg-dim: #555;
                --fg-label: #ccc;
                --fg-toggle: #aaa;
                --border: #333;
                --border-hover: #555;
                --card: #1a1d27;
                --grid: #1f2230;
                --tick: #555;
                --chart-legend: #aaa;
                --overlay-bg: #1a1d27;
                --overlay-border: #333;
                --table-row-alt: #22252f;
                --table-header-bg: #161922;
            }
            [data-theme="light"] {
                --bg: #f5f5f5;
                --fg: #1a1a1a;
                --fg-heading: #111;
                --fg-subtle: #666;
                --fg-muted: #888;
                --fg-dim: #aaa;
                --fg-label: #333;
                --fg-toggle: #555;
                --border: #ccc;
                --border-hover: #999;
                --card: #fff;
                --grid: #e5e5e5;
                --tick: #999;
                --chart-legend: #555;
                --overlay-bg: #fff;
                --overlay-border: #ccc;
                --table-row-alt: #f5f5f5;
                --table-header-bg: #eee;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--fg);
                padding: 24px;
            }
            h1 {
                font-size: 1.5rem;
                font-weight: 600;
                margin-bottom: 8px;
                color: var(--fg-heading);
            }
            .subtitle {
                font-size: 0.85rem;
                color: var(--fg-subtle);
                margin-bottom: 24px;
            }
            .section-title {
                font-size: 1.1rem;
                font-weight: 600;
                margin-bottom: 16px;
                color: var(--fg-label);
            }
            #comparison-section {
                margin-bottom: 32px;
            }
            #comparison-container {
                background: var(--card);
                border-radius: 12px;
                padding: 20px;
                margin-bottom: 12px;
            }
            #comparison-chart {
                height: 250px !important;
            }
            #comparison-empty {
                text-align: center;
                color: var(--fg-muted);
                padding: 40px;
                font-size: 0.9rem;
            }
            #toggles {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 24px;
            }
            .toggle-btn {
                padding: 6px 14px;
                border-radius: 20px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--fg-toggle);
                cursor: pointer;
                font-size: 0.8rem;
                transition: all 0.15s;
            }
            .toggle-btn.active {
                border-color: var(--cfg-color, #6366f1);
                color: var(--fg-heading);
                background: color-mix(
                    in srgb,
                    var(--cfg-color, #6366f1) 20%,
                    transparent
                );
            }
            .toggle-btn:hover {
                border-color: var(--border-hover);
            }
            #tiles {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
                gap: 16px;
            }
            .tile {
                background: var(--card);
                border-radius: 12px;
                padding: 20px;
            }
            .tile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
                gap: 8px;
            }
            .tile-label {
                font-size: 1rem;
                font-weight: 600;
                color: var(--fg-heading);
            }
            .tile-model {
                font-size: 0.75rem;
                color: var(--fg-muted);
            }
            .tile-data-btn {
                padding: 3px 10px;
                border-radius: 12px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--fg-subtle);
                cursor: pointer;
                font-size: 0.7rem;
                transition: all 0.15s;
                white-space: nowrap;
            }
            .tile-data-btn:hover {
                border-color: var(--border-hover);
                color: var(--fg-heading);
            }
            .tile-canvas-wrap {
                position: relative;
                height: 180px;
                margin-bottom: 12px;
            }
            .tile-canvas {
                position: absolute;
                inset: 0;
                width: 100% !important;
                height: 100% !important;
            }
            .tile-stats {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            .stat {
                text-align: center;
            }
            .stat-value {
                font-size: 1.1rem;
                font-weight: 600;
                color: var(--fg-heading);
            }
            .stat-label {
                font-size: 0.65rem;
                color: var(--fg-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
                margin-top: 2px;
            }
            .empty-tile {
                text-align: center;
                color: var(--fg-dim);
                padding: 60px 20px;
                font-size: 0.9rem;
            }
            #header-row {
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                margin-bottom: 24px;
            }
            #theme-toggle {
                display: flex;
                gap: 4px;
                flex-shrink: 0;
            }
            #data-overlay {
                border: 1px solid var(--overlay-border);
                border-radius: 12px;
                background: var(--overlay-bg);
                color: var(--fg);
                padding: 0;
                max-width: min(90vw, 700px);
                width: 90vw;
                max-height: 80vh;
                margin: auto;
            }
            #data-overlay::backdrop {
                background: rgba(0, 0, 0, 0.5);
            }
            .overlay-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 16px 20px;
                border-bottom: 1px solid var(--border);
            }
            .overlay-title {
                font-size: 1rem;
                font-weight: 600;
                color: var(--fg-heading);
            }
            .overlay-close {
                padding: 4px 10px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--fg-subtle);
                cursor: pointer;
                font-size: 0.8rem;
            }
            .overlay-close:hover {
                border-color: var(--border-hover);
                color: var(--fg-heading);
            }
            .overlay-body {
                padding: 16px 20px;
                overflow-x: auto;
            }
            .data-table {
                width: 100%;
                border-collapse: collapse;
                font-size: 0.85rem;
            }
            .data-table th {
                text-align: left;
                padding: 8px 12px;
                background: var(--table-header-bg);
                color: var(--fg-subtle);
                font-weight: 600;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                position: sticky;
                top: 0;
            }
            .data-table td {
                padding: 6px 12px;
                border-top: 1px solid var(--border);
                color: var(--fg);
            }
            .data-table tr:nth-child(even) td {
                background: var(--table-row-alt);
            }
            .overlay-empty {
                text-align: center;
                color: var(--fg-muted);
                padding: 40px 20px;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div id="header-row">
            <div>
                <h1>LLM Performance Monitor</h1>
                <p class="subtitle" id="last-refresh">Loading...</p>
            </div>
            <div id="theme-toggle">
                <button class="toggle-btn" data-mode="light">Light</button>
                <button class="toggle-btn active" data-mode="auto">Auto</button>
                <button class="toggle-btn" data-mode="dark">Dark</button>
            </div>
        </div>

        <section id="comparison-section">
            <h2 class="section-title">Comparison (24h)</h2>
            <div id="toggles"></div>
            <div id="comparison-container">
                <canvas id="comparison-chart"></canvas>
                <div id="comparison-empty" style="display: none">
                    Select configurations to compare
                </div>
            </div>
        </section>

        <section>
            <h2 class="section-title">Per-Configuration (48h)</h2>
            <div id="tiles"></div>
        </section>

        <dialog id="data-overlay">
            <div class="overlay-header">
                <span class="overlay-title" id="overlay-title"></span>
                <button class="overlay-close" id="overlay-close">Close</button>
            </div>
            <div class="overlay-body" id="overlay-body">
                <table class="data-table" id="data-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>TPS</th>
                            <th>TTFT</th>
                            <th>TT100T</th>
                            <th>Latency (ms)</th>
                            <th>HTTP Status</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body"></tbody>
                </table>
            </div>
        </dialog>

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
        <script src="https://cdn.jsdelivr.net/npm/date-fns@3"></script>
        <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
        <script src="app.js"></script>
    </body>
</html>
